name: Deploy AG News BERT API

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/deploy.yml"
      - "AG_News/bert-base-uncased/seed=1/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - service_name: ag-news-bert-base-uncased-seed-1
            region: us-central1
            project_id: bert-family
            repo: bert-family-prod          # <-- CAMBIA esto al nombre real de tu repo en Artifact Registry
            image_name: ag-news-bert-base-uncased-seed-1
            image_tag: 1.0.0               # <-- puedes cambiar a ${{ github.sha }} si quieres
            context_path: AG_News/bert-base-uncased/seed=1
            platform: linux/amd64
            memory: 2Gi
            cpu: "2"
            concurrency: "32"
            timeout: 300s
            min_instances: "0"
            max_instances: "4"
            ingress: all
            sa_email: bert-family-cloudrun-sa@bert-family.iam.gserviceaccount.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ matrix.region }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: ${{ matrix.context_path }}
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            -t ${{ matrix.image_name }}:${{ matrix.image_tag }} \
            . --load

      - name: Tag Docker image
        run: |
          docker tag ${{ matrix.image_name }}:${{ matrix.image_tag }} \
            ${{ matrix.region }}-docker.pkg.dev/${{ matrix.project_id }}/${{ matrix.repo }}/${{ matrix.image_name }}:${{ matrix.image_tag }}

      - name: Push Docker image
        run: |
          docker push ${{ matrix.region }}-docker.pkg.dev/${{ matrix.project_id }}/${{ matrix.repo }}/${{ matrix.image_name }}:${{ matrix.image_tag }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ matrix.service_name }} \
            --image=${{ matrix.region }}-docker.pkg.dev/${{ matrix.project_id }}/${{ matrix.repo }}/${{ matrix.image_name }}:${{ matrix.image_tag }} \
            --platform=managed \
            --region=${{ matrix.region }} \
            --project=${{ matrix.project_id }} \
            --memory=${{ matrix.memory }} \
            --cpu=${{ matrix.cpu }} \
            --concurrency=${{ matrix.concurrency }} \
            --timeout=${{ matrix.timeout }} \
            --service-account=${{ matrix.sa_email }} \
            --max-instances=${{ matrix.max_instances }} \
            --min-instances=${{ matrix.min_instances }} \
            --ingress=${{ matrix.ingress }} \
            --execution-environment=gen2

      - name: Post-deploy URL
        run: |
          gcloud run services describe ${{ matrix.service_name }} \
            --region=${{ matrix.region }} --project=${{ matrix.project_id }} \
            --format='value(status.url)'
