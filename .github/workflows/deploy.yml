    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker ${{ matrix.region }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: ${{ matrix.context_path }}
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            -t ${{ matrix.image_name }}:${{ matrix.image_tag }} \
            . --load

      - name: Tag Docker image
        run: |
          docker tag ${{ matrix.image_name }}:${{ matrix.image_tag }} \
            ${{ matrix.region }}-docker.pkg.dev/${{ matrix.project_id }}/${{ matrix.repo }}/${{ matrix.image_name }}:${{ matrix.image_tag }}

      - name: Push Docker image
        run: |
          docker push ${{ matrix.region }}-docker.pkg.dev/${{ matrix.project_id }}/${{ matrix.repo }}/${{ matrix.image_name }}:${{ matrix.image_tag }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ matrix.service_name }} \
            --image=${{ matrix.region }}-docker.pkg.dev/${{ matrix.project_id }}/${{ matrix.repo }}/${{ matrix.image_name }}:${{ matrix.image_tag }} \
            --platform=managed \
            --region=${{ matrix.region }} \
            --project=${{ matrix.project_id }} \
            --memory=${{ matrix.memory }} \
            --cpu=${{ matrix.cpu }} \
            --concurrency=${{ matrix.concurrency }} \
            --timeout=${{ matrix.timeout }} \
            --service-account=${{ matrix.sa_email }} \
            --max-instances=${{ matrix.max_instances }} \
            --min-instances=${{ matrix.min_instances }} \
            --ingress=${{ matrix.ingress }} \
            --execution-environment=gen2

      - name: Post-deploy URL
        run: |
          echo "Service: ${{ matrix.service_name }}"
          gcloud run services describe ${{ matrix.service_name }} \
            --region=${{ matrix.region }} --project=${{ matrix.project_id }} \
            --format='value(status.url)'

