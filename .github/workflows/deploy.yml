            region: us-central1
            project_id: bert-family
            repo: bert-family-prod
            image_name: ag-news-bert-base-uncased-seed-1
            image_tag: 1.0.0
            context_path: AG_News/bert-base-uncased/seed=1
            platform: linux/amd64
            memory: 2Gi
            cpu: "2"
            concurrency: "32"
            timeout: 300s
            min_instances: "0"
            max_instances: "4"
            ingress: all
            sa_email: bert-family-cloudrun-sa@bert-family.iam.gserviceaccount.com

