name: Deploy All NLP APIs to Cloud Run (36 services)

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/deploy.yml"
      - "AG_News/**"
      - "DB_Pedia/**"
      - "IMDB/**"
      - "SSTv2/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      max-parallel: 36
      matrix:
